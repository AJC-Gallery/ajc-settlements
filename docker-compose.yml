# Local PostgreSQL. One major version everywhere: local, CI, Neon (17).
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ajc_settlements
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ajc_settlements"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
